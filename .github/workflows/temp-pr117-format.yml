name: Temporary Prettier read-only output for PR 117

on:
  pull_request:

permissions:
  contents: read

jobs:
  formatter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the PR commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked formatter
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format source in temporary runner and emit public code for review
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/prettier --write src/clickup/catalog-runtime.ts tests/v2-pagination-regression.test.ts
          echo '=== BEGIN FORMAT RUNTIME ==='
          base64 -w0 src/clickup/catalog-runtime.ts
          echo
          echo '=== END FORMAT RUNTIME ==='
          echo '=== BEGIN FORMAT TESTS ==='
          base64 -w0 tests/v2-pagination-regression.test.ts
          echo
          echo '=== END FORMAT TESTS ==='
