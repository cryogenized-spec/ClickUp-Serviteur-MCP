name: Temporary PR 122 read-only formatting

on:
  pull_request:

permissions:
  contents: read

jobs:
  formatter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pinned
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Emit formatted public source for review
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/prettier --write src/clickup/catalog-runtime.ts src/mcp/tool-catalog.ts tests/v2-task-intelligence-templates.test.ts
          echo '=== BEGIN FORMATTED RUNTIME ==='
          base64 -w0 src/clickup/catalog-runtime.ts
          echo
          echo '=== END FORMATTED RUNTIME ==='
          echo '=== BEGIN FORMATTED CATALOG ==='
          base64 -w0 src/mcp/tool-catalog.ts
          echo
          echo '=== END FORMATTED CATALOG ==='
          echo '=== BEGIN FORMATTED TEST ==='
          base64 -w0 tests/v2-task-intelligence-templates.test.ts
          echo
          echo '=== END FORMATTED TEST ==='
