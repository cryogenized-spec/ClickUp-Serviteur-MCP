name: One-time company deploy dispatch for issue 86

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-company-deploy-86.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: "${{ github.repository == 'cryogenized-spec/ClickUp-Serviteur-MCP' && github.event.head_commit.message == 'ops: one-time dispatch existing company deploy after issue 86' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Invoke existing manual company deployment workflow once
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: cryogenized-spec/ClickUp-Serviteur-MCP
        run: gh workflow run deploy-company.yml --repo "$GH_REPO" --ref main
