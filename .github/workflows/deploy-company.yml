name: Deploy ClickUp MCP company (manual, non-destructive read-write)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clickup-serviteur-company-deploy
  cancel-in-progress: false

jobs:
  company:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: company
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node 22 for pinned Wrangler
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Reproducible install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Mandatory complete verification
        run: |
          python3 scripts/check_repo_policy.py
          python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
          npm run format:check
          npm run lint
          npm run typecheck
          npm test
          npm run build
          node scripts/staging-local-smoke.mjs
          npm audit --audit-level=high
      - name: Generate dedicated company manifest
        env:
          COMPANY_OAUTH_KV_ID: ${{ vars.COMPANY_OAUTH_KV_ID }}
          COMPANY_WORKSPACE_ID: ${{ vars.COMPANY_WORKSPACE_ID }}
          COMPANY_LIST_ID: ${{ vars.COMPANY_LIST_ID }}
          COMPANY_GITHUB_OWNER_ID: ${{ vars.COMPANY_GITHUB_OWNER_ID }}
          COMPANY_CLICKUP_USER_ID: ${{ vars.COMPANY_CLICKUP_USER_ID }}
          COMPANY_CLEANUP_ENABLED: ${{ vars.COMPANY_CLEANUP_ENABLED }}
          COMPANY_PUBLIC_ORIGIN: ${{ vars.COMPANY_PUBLIC_ORIGIN }}
          STAGING_OAUTH_KV_ID: ${{ vars.STAGING_OAUTH_KV_ID }}
          STAGING_PUBLIC_ORIGIN: ${{ vars.STAGING_PUBLIC_ORIGIN }}
        run: node scripts/generate-company-config.mjs
      - name: Deploy only the isolated company non-destructive Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.COMPANY_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.COMPANY_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler deploy --config .wrangler-company.generated.jsonc
      - name: Remove temporary company config
        if: always()
        run: rm -f .wrangler-company.generated.jsonc
