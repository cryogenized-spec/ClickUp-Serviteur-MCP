name: Temporary format for issue 86 feature branch

on:
  push:
    branches:
      - feat/comment-assignee-86

permissions:
  contents: write

jobs:
  format:
    if: github.ref == 'refs/heads/feat/comment-assignee-86'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned formatter
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format only new implementation and tests
        run: ./node_modules/.bin/prettier --write src/clickup/catalog-runtime.ts tests/comment-assignment.test.ts
      - name: Commit formatting only if needed
        run: |
          if ! git diff --quiet -- src/clickup/catalog-runtime.ts tests/comment-assignment.test.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- src/clickup/catalog-runtime.ts tests/comment-assignment.test.ts
            git commit -m "style: apply pinned Prettier to issue 86 implementation"
            git push origin HEAD:feat/comment-assignee-86
          fi
