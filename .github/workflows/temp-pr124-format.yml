name: Temporary PR 124 formatting
on:
  pull_request:
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format public source in read-only runner
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/prettier --write src/clickup/webhook-verification.ts tests/webhook-verification.test.ts
          echo '=== BEGIN FORMAT VERIFY ==='
          base64 -w0 src/clickup/webhook-verification.ts
          echo
          echo '=== END FORMAT VERIFY ==='
          echo '=== BEGIN FORMAT TEST ==='
          base64 -w0 tests/webhook-verification.test.ts
          echo
          echo '=== END FORMAT TEST ==='
