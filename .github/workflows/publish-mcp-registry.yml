name: Validate and publish ClickUp Serviteur to the official MCP Registry

on:
  pull_request:
    paths:
      - server.json
      - .github/workflows/publish-mcp-registry.yml
  push:
    branches: [main]
    paths:
      - server.json
      - .github/workflows/publish-mcp-registry.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download official MCP publisher
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/mcp-publisher.tar.gz" \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz"
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP" mcp-publisher
          "$RUNNER_TEMP/mcp-publisher" validate server.json

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 10
    steps:
      - name: Checkout registry metadata from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download official MCP publisher
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/mcp-publisher.tar.gz" \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz"
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP" mcp-publisher
      - name: Authenticate with GitHub OIDC and publish registry metadata
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          "$RUNNER_TEMP/mcp-publisher" publish server.json
      - name: Check registry listing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import time
          import urllib.parse
          import urllib.request

          name = "io.github.cryogenized-spec/clickup-serviteur-mcp"
          base = "https://registry.modelcontextprotocol.io/v0.1/servers?search="
          url = base + urllib.parse.quote(name, safe="")
          for attempt in range(5):
              with urllib.request.urlopen(url, timeout=15) as response:
                  result = json.load(response)
              if any(item.get("server", {}).get("name") == name for item in result.get("servers", [])):
                  print("Published official registry listing:", name)
                  break
              if attempt == 4:
                  raise SystemExit("Publisher returned success, but registry listing was not yet visible")
              time.sleep(5)
          PY
